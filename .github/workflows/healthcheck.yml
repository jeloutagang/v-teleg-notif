name: Daily Health Check

on:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and rclone
        run: |
          pip install -U "yt-dlp[curl-cffi]"
          sudo apt-get update && sudo apt-get install -y rclone

      - name: Configure rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: Run Checks & Notify Telegram
        env:
          VIMEO_COOKIES_DATA: ${{ secrets.VIMEO_COOKIES }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "$VIMEO_COOKIES_DATA" > cookies.txt

          if yt-dlp --simulate --impersonate chrome --cookies cookies.txt "https://vimeo.com/76979871" > /dev/null 2>&1; then
            VIMEO_STATUS="✅ Vimeo Cookies: Khdamin mzyan"
          else
            VIMEO_STATUS="❌ Vimeo Cookies: Matou awla fihom mochkil (khsek t-jeddedhom)"
          fi

          if rclone lsd gdrive:VimeoDownloads/ > /dev/null 2>&1; then
            DRIVE_STATUS="✅ Google Drive: Khdam mzyan"
          else
            DRIVE_STATUS="❌ Google Drive: Kayn mochkil f rclone"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🩺 Daily Health Check
          ${VIMEO_STATUS}
          ${DRIVE_STATUS}"
