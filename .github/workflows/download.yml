name: Download Vimeo to Drive

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Vimeo Video URL'
        required: true
      video_title:
        description: 'Video Title'
        required: false

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp and rclone
        run: |
          pip install -U "yt-dlp[curl-cffi]"
          curl https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG }}
        run: |
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf

      - name: Wait for Vimeo processing & Download
        env:
          VIMEO_COOKIES_DATA: ${{ secrets.VIMEO_COOKIES }}
        run: |
          mkdir -p downloads
          for i in {1..15}; do
            echo "Attempt $i..."
            echo "$VIMEO_COOKIES_DATA" > cookies.txt
            if yt-dlp -N 8 --impersonate chrome --cookies cookies.txt -f "bestvideo+bestaudio/best" --merge-output-format mp4 -o "downloads/%(title)s.%(ext)s" "${{ github.event.inputs.video_url }}" > yt_error.log 2>&1; then
              cat yt_error.log
              break
            fi
            cat yt_error.log
            if [ "$i" -eq 15 ]; then exit 1; fi
            sleep 30
          done
      - name: Upload to Google Drive
        run: |
          rclone move downloads/ gdrive:VimeoDownloads/ --progress

      - name: Notify Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="✅ Video t-telechargat f Google Drive (VimeoDownloads)!\n🎞️ ${{ github.event.inputs.video_title }}\n🔗 ${{ github.event.inputs.video_url }}"
